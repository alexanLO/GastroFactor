<header>
  <nav class="navbar">
    <div class="logo">Gastro Factor</div>
    <div class="menu">
      <a routerLink="/gastrofactor" routerLinkActive="active">Home</a>
      <a routerLink="/meu-acervo" routerLinkActive="active">Meu Acervo</a>
      <a routerLink="/sobre" routerLinkActive="active">Sobre</a>
    </div>
    <div class="auth">
      @if (!authService.isAuthenticated()) {
        <a (click)="onLogin()">Login</a>
        <a (click)="onRegister()">Cadastrar-se</a>
      } @else {
        <a (click)="onLogout()">Logout</a>
      }
      <img alt="Chef Profile" class="profile-image" src="/profile.png" />
    </div>
  </nav>
</header>
