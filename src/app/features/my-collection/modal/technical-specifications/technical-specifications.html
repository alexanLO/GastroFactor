<div class="card-body">

  <main class="card-content">
    <header class="card-header" [style.background-image]="selectedImage 
    ? 'linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url(' + selectedImage + ')' 
    : 'linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url(/bg-TechnicalSpecification.png)'">

      <div class="card-header-content">
        <span class="card-subtitle">Editorial Template</span>
        <h1 class="card-title">Ficha Técnica<br /><span>de Preparo</span></h1>
      </div>
      <div class="card-btn-conteiner">

        <button class="card-btn-import-img" (click)="onImportImage()">
          <span class="material-symbols-outlined">upload_file</span>
          <span>Importar Imagem</span>
        </button>
        <input type="file" accept="image/*" #fileInput style="display: none" (change)="onFileSelected($event)" />

        <button class="card-btn-save" (click)="saveRecipe()" [disabled]="isSaving">
          <span class="material-symbols-outlined">save</span>
          <span>{{ isSaving ? 'Salvando...' : 'Salvar' }}</span>
        </button>

        <button class="card-btn-export" (click)="exportPdf()">
          <span class="material-symbols-outlined">picture_as_pdf</span>
          <span>Exportar PDF</span>
        </button>
      </div>
    </header>

    <div class="card-grid">
      <!--TODO <div class="grid grid-cols-1 lg:grid-cols-12 gap-8"> >>>>  <div class="lg:col-span-8 space-y-8"></div> -->

      <!-- Seção principal de Dados -->
      <app-details-card></app-details-card>

      <!-- Tabela de ingrediente -->
      <app-ingredients-card></app-ingredients-card>

      <!-- Sidebar Nutricional -->
      <app-nutritional-card></app-nutritional-card>

      <!-- Método de Preparo -->
      <app-preparation-method-card></app-preparation-method-card>
    </div>
  </main>

</div>
