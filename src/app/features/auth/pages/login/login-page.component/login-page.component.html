<body class="app">
  <div class="noise-overlay"></div>

  <main class="login-page">
    <section class="login-modal" aria-labelledby="login-title">
      <article class="login-card glass-panel editorial-shadow">
        <!-- Close Button-->
        <button
          class="login-card__close"
          type="button"
          aria-label="Fechar modal"
          (click)="onClose()"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>

        <div class="login-card__content">
          <aside class="login-card__banner">
            <img
              src="/login-modal.png"
              alt="Chef em uma cozinha profissional"
              class="login-card__banner-image"
              3333
            />

            <div class="login-card__banner-overlay"></div>

            <div class="login-card__banner-content">
              <h2 class="login-card__quote">A arte encontra a álgebra.</h2>

              <div class="divider"></div>
            </div>
          </aside>

          <section class="login-card__form-section">
            <header class="login-header">
              <h1 class="login-header__brand">Gastro Factor</h1>

              <h2 id="login-title" class="login-header__title">Bem-vindo de volta</h2>

              <div class="divider divider--left"></div>
            </header>

            <form
              [formGroup]="loginForm"
              (ngSubmit)="onSubmit()"
              class="login-form"
              autocomplete="on"
            >
              <div class="form-group">
                <label for="email"> E-mail </label>

                <input
                  id="email"
                  type="email"
                  placeholder="chef@gastrofactor.com"
                  formControlName="email"
                  required="true"
                />

                <app-error-input
                  [control]="loginForm.get('email')"
                  fieldName="email"
                ></app-error-input>
              </div>

              <div class="form-group">
                <div class="form-group__header">
                  <label for="password"> Senha </label>
                  <a href="#"> Esqueceu a senha? </a>
                </div>

                <input
                  id="password"
                  type="password"
                  placeholder="••••••••"
                  formControlName="password"
                  required="true"
                />
                <app-error-input
                  [control]="loginForm.get('password')"
                  fieldName="password"
                ></app-error-input>
              </div>

              <button type="submit" class="btn btn__primary" [disabled]="isSubmitting">
                <span>{{ isSubmitting ? 'Entrando...' : 'Entrar' }}</span>
              </button>
            </form>

            <section class="social-section" aria-label="Login social">
              <div class="social-divider" role="separator">
                <span>Ou continue com</span>
              </div>

              <div class="social-actions">
                <button class="btn-social" type="button" aria-label="Entrar com Google">
                  <img src="/google-logo.png" alt="Logo do Google" /> Google
                </button>
                <button class="btn-social" type="button" aria-label="Entrar com Apple">
                  <img src="/ios-logo.png" alt="Logo da Apple" /> Apple
                </button>
              </div>
            </section>

            <footer class="login-footer">
              <p>
                Não possui uma conta?
                <a href="#">Solicitar acesso</a>
              </p>
            </footer>
          </section>
        </div>
      </article>
    </section>
  </main>
</body>
