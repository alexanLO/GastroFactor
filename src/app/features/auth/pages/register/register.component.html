<div
  class="modal-overlay"
  open
  aria-labelledby="register-title"
  aria-modal="true"
  (click)="onClose()"
>
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="btn-close" type="button" aria-label="Fechar modal" (click)="onClose()">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>

    <header class="modal-header">
      <span class="brand" aria-label="Marca Gastro Factor">Gastro Factor</span>
      <h1 id="register-title" class="title">Crie sua conta profissional</h1>
      <p class="subtitle">Comece a padronizar suas receitas e controlar seus custos hoje mesmo.</p>
    </header>

    <section class="modal-body">
      <form (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-group">
          <label for="name">NOME COMPLETO</label>
          <input
            type="text"
            id="nome"
            formControlName="name"
            placeholder="Ex: Helena Rizzo"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">E-MAIL</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="seu@restaurante.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="occupation">OCUPAÇÂO</label>
          <select id="occupation" formControlName="occupation">
            <option value="">Selecione sua função</option>
            <option value="chef">Chef de Cozinha</option>
            <option value="sous-chef">Sub Chef</option>
            <option value="owner">Proprietário</option>
            <option value="student">Estudante</option>
            <option value="enthusiast">Entusiasta da Gastronomia</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">SENHA</label>
            <input
              type="password"
              id="senha"
              formControlName="password"
              placeholder="********"
              required
            />
          </div>
          <div class="form-group">
            <label for="confirmsPassword">CONFIRMAR SENHA</label>
            <input
              type="password"
              id="confirmar"
              formControlName="confirmsPassword"
              placeholder="********"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <!--TODO [disabled]="registerForm.invalid" -->
          CRIAR CONTA
        </button>
      </form>
    </section>

    <section class="social-section" aria-label="Login social">
      <div class="social-divider" role="separator">
        <span>Ou continue com</span>
      </div>

      <div class="social-actions">
        <button class="btn-social" type="button" aria-label="Entrar com Google">
          <img src="/google-logo.png" alt="Logo do Google" /> Google
        </button>
        <button class="btn-social" type="button" aria-label="Entrar com Apple">
          <img src="/ios-logo.png" alt="Logo da Apple" /> Apple
        </button>
      </div>
    </section>

    <footer class="modal-footer">
      <p>
        Já possui uma conta?
        <a (click)="onLogin()" rel="nofollow">Entre aqui</a>.
      </p>
    </footer>
  </div>
</div>
